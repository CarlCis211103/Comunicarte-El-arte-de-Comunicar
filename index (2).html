<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de clientes</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f6f5f1;--sf:#fff;--tx:#1f2430;--mu:#6b7280;--bd:#e2e0d8;--ac:#1d6b57;--ac2:#e3f1ec;--wr:#b4540a;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--sf:#1e2128;--tx:#eceae4;--mu:#9aa0ab;--bd:#323640;--ac:#4cc3a3;--ac2:#1d3a33;--wr:#f0a05c;--er:#f47c70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--sf:#1e2128;--tx:#eceae4;--mu:#9aa0ab;--bd:#323640;--ac:#4cc3a3;--ac2:#1d3a33;--wr:#f0a05c;--er:#f47c70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 10px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--mu);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px;resize:vertical}
button.b{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer}
button.g{background:none;color:var(--ac);border:1px solid var(--bd);border-radius:7px;padding:6px 10px;font:inherit;cursor:pointer}
button.d{color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px;margin:2px 2px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}
.stats b{display:block;font-size:20px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mu);font-weight:600}
.od{color:var(--er);font-weight:600}.wn{color:var(--wr)}
.s-pendiente{border-left:4px solid #9aa0ab}.s-trabajando{border-left:4px solid #d99a1a}.s-terminado{border-left:4px solid #2f7de1}.s-implementado{border-left:4px solid #2e9e6b}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:560px;width:100%;max-height:90%;overflow:auto;margin:0}
.modal textarea{min-height:230px}
</style></head><body>
<header><div class="row" style="justify-content:space-between"><h1>Control de clientes · Marketing y comercialización digital</h1><div id="who" class="row"></div></div><nav id="nav"></nav></header>
<main id="main">Cargando…</main>
<div id="md"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>"$"+Math.round(n||0).toLocaleString("es-MX");
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const fd=d=>d?d.split("-").reverse().join("/"):"—";
const addD=(s,n)=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return iso(d)};
const addM=(s,m)=>{const d=new Date(s+"T00:00");d.setMonth(d.getMonth()+m);return iso(d)};
const days=s=>Math.round((new Date(s+"T00:00")-new Date(today()+"T00:00"))/864e5);
const ST=["pendiente","trabajando","terminado","implementado"];
const STL={pendiente:"Pendiente",trabajando:"Trabajando",terminado:"Terminado",implementado:"Implementado"};
const FQ=["mensual","semanal","único"];
const FAC={mensual:1,semanal:4.33,"único":0};
const TABS=[["hoy","Hoy"],["cal","Calendario"],["clientes","Clientes activos"],["nuevo","Cliente nuevo"],["par","Partners"],["pgo","Pagos a equipo y partners"],["parn","Partner nuevo"],["proy","Proyectos y deadlines"],["cob","Cobros"],["inf","Informes"],["tab","Tabulador de precios"],["cot","Cotizador"],["com","Info comercial"],["usr","Usuarios"]];
const TPL=["Calendario de contenido; Publicación y programación; Reporte mensual","Brief y propuesta; Diseño de piezas; Aprobación del cliente","Optimizar perfil GBP; Publicar fotos y novedades; Reporte de posicionamiento","Estrategia y segmentación; Lanzar campaña; Optimización y reporte","Diseñar flujo de mensajes; Configurar envíos; Reporte de resultados","Reporte semanal de resultados","Estructura y contenido; Diseño; Desarrollo; Publicación","Planeación de sesión; Sesión; Edición y entrega"];
const defaults=()=>({clients:[],tasks:[],reports:[],quotes:[],info:"",pagos:[],pend:[],log:[],grp:false,partners:[],pagosOut:[],mgrs:[{n:"Comisionado 1",uid:""},{n:"Comisionado 2",uid:""}],services:[
["Community management (redes sociales)",3000,1500,"mensual"],["Diseño de contenido y creativos",2000,1000,"mensual"],
["Google Business Profile / SEO local",1500,1000,"mensual"],["Administración de campañas (Meta/Google Ads)",2500,1500,"mensual"],
["Email y WhatsApp marketing",1200,800,"mensual"],["Estrategia y reporte semanal",800,600,"semanal"],
["Sitio web / landing page",6000,3000,"único"],["Fotografía y video",3500,1500,"único"]].map(([n,c,g,u],i)=>({id:uid(),n,c,g,u,tpl:TPL[i]}))});
let role="admin",S=defaults(),tab="hoy",ui={q:{p:"",lines:[],notas:"",dias:15}},db=null,ready=false,st;
const svc=id=>S.services.find(s=>s.id===id);
const cl=id=>S.clients.find(c=>c.id===id);
const price=s=>(+s.c||0)+(+s.g||0);
const opt=(l,v)=>l.map(([a,b])=>`<option value="${esc(a)}"${a===v?" selected":""}>${esc(b)}</option>`).join("");

let CSRF="",uname="",pollT=null;
async function api(a,body){
 try{const r=await fetch("api.php?a="+a,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-CSRF":CSRF},credentials:"same-origin",body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&a!=="login"){CSRF="";ready=false;showLogin("Inicia sesión para continuar.");return{ok:false,auth:true}}
  return Object.assign({ok:r.ok},j)}catch(e){return{ok:false,err:"Sin conexión con el servidor"}}
}
function showLogin(msg){
 clearInterval(pollT);document.getElementById("nav").innerHTML="";document.getElementById("who").innerHTML="";
 document.getElementById("main").innerHTML=`<div class="card" style="max-width:340px;margin:40px auto"><h3 style="margin-top:0">Iniciar sesión</h3><form id="lf"><label>Usuario</label><input id="lu" autocomplete="username" required><label style="margin-top:8px">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required><p class="od" id="le" style="min-height:20px"></p><button class="b" style="width:100%">Entrar</button></form></div>`;
 document.getElementById("le").textContent=msg||"";
 document.getElementById("lf").onsubmit=async e=>{e.preventDefault();const r=await api("login",{u:document.getElementById("lu").value,p:document.getElementById("lp").value});if(r.ok)boot();else document.getElementById("le").textContent=r.err||"Usuario o contraseña incorrectos"};
}
function hdr(){document.getElementById("who").innerHTML=`<span id="sv" class="od"></span><span class="mu">${esc(uname)} · ${role==="mgr"?"Comisionado":"Administrador"}</span><button class="g" data-a="out">Salir</button>`}
function applyMgr(d){S=Object.assign(defaults(),{clients:d.clients||[],tasks:d.tasks||[],services:[],mgrName:d.n||""})}
async function boot(){
 const m=await api("me");if(!m.ok){if(!m.auth)showLogin(m.err);return}
 CSRF=m.csrf;role=m.role;uname=m.name;
 const r=await api("state");if(!r.ok){if(!r.auth)showLogin(r.err);return}
 clearInterval(pollT);
 if(role==="mgr"){applyMgr(r.data||{});tab="ini";pollT=setInterval(async()=>{const x=await api("state");if(x.ok){applyMgr(x.data||{});render()}},60000)}
 else{const d=r.data&&Object.keys(r.data).length?r.data:null;S=Object.assign(defaults(),d||{});S.mgrs=(m.mgrs||[]).map(n=>({n}));tab="hoy";ready=true;if(!d)save()}
 hdr();render();
}
function save(){
 if(!ready||role==="mgr")return;clearTimeout(st);
 st=setTimeout(async()=>{const j=JSON.parse(JSON.stringify(S));delete j.mgrs;const r=await api("save",{state:j}),e=document.getElementById("sv");if(e)e.textContent=r.ok||r.auth?"":"⚠ No se pudo guardar"},400);
}
function render(){
 document.getElementById("nav").innerHTML=(role==="mgr"?[["ini","Inicio"],["cal","Calendario"]]:TABS).map(([k,l])=>`<button class="${k===tab?"on":""}" data-a="tab" data-v="${k}">${l}</button>`).join("");
 document.getElementById("main").innerHTML=({ini:vMgr,par:vPar,parn:vParN,pgo:vOut,usr:vUsr,hoy:vHoy,cal:vCal,cob:vCob,clientes:vCli,nuevo:vNew,proy:vProy,inf:vInf,tab:vTab,cot:vCot,com:vCom})[tab]();
}
function monthly(c){let i=0,g=0;(c.svcs||[]).forEach(x=>{const f=FAC[x.f]||0,s=svc(x.sid);i+=x.p*f;g+=(x.p-(x.r!=null?+x.r:s?+s.c:0))*f});return{i,g}}

const par=id=>(S.partners||[]).find(p=>p.id===id);
function pstat(p){let n=0,I=0,G=0;const L=[];S.clients.filter(c=>c.active&&c.ref===p.id).forEach(c=>{const m=monthly(c);n++;I+=m.i;G+=m.g;L.push(c)});return{n,I,G,L,C:Math.max(0,G)*(+p.pct||0)/100}}
function totals(){let I=0,G=0,C=0;S.clients.filter(c=>c.active).forEach(c=>{const m=monthly(c);I+=m.i;G+=m.g});(S.partners||[]).forEach(p=>C+=pstat(p).C);return{I,G,C,N:G-C}}
function partnerCard(){
 const P=S.partners||[];if(!P.length)return"";
 return `<div class="card"><h3 style="margin-top:0">Partners (referidos)</h3><div class="tw"><table><tr><th>Partner</th><th>%</th><th>Clientes referidos</th><th>Ingreso mensual</th><th>Ganancia generada</th><th>Comisión mensual</th></tr>${P.map(p=>{const t=pstat(p);return `<tr><td>${esc(p.nombre)}${p.active===false?' <span class="mu">(baja)</span>':""}</td><td>${+p.pct||0}%</td><td>${t.n}${t.L.length?'<div class="mu">'+t.L.map(c=>esc(c.nombre)).join(", ")+"</div>":""}</td><td>${money(t.I)}</td><td>${money(t.G)}</td><td><b>${money(t.C)}</b></td></tr>`}).join("")}</table></div></div>`}

const mcost=c=>{const m=monthly(c);return m.i-m.g};
const mgrNames=()=>[...new Set([...(S.mgrs||[]).map(m=>m.n),...S.clients.map(c=>c.enc).filter(Boolean)])];
const oWho=o=>o.k==="partner"?(par(o.w)?.nombre||"(partner eliminado)"):(o.w||"—");
const oOpts=o=>o.k==="partner"?opt((S.partners||[]).map(p=>[p.id,p.nombre]),o.w):opt(mgrNames().map(n=>[n,n]),o.w);
function vOut(){
 const O=(S.pagosOut||[]).slice().sort((a,b)=>a.f.localeCompare(b.f)),pen=O.filter(p=>!p.ok),late=pen.filter(p=>p.f<today()),sum=l=>l.reduce((t,p)=>t+p.a,0),mes=today().slice(0,7);
 return `<div class="stats"><div><b>${money(sum(pen))}</b><span class="mu">Por pagar</span></div><div><b class="od">${money(sum(late))}</b><span class="mu">Vencido (${late.length})</span></div><div><b>${money(sum(O.filter(p=>p.ok&&(p.fp||"").slice(0,7)===mes)))}</b><span class="mu">Pagado este mes</span></div><div><b>${money(sum(O.filter(p=>p.ok)))}</b><span class="mu">Pagado en total</span></div></div>
 <div class="row" style="margin-bottom:10px"><button class="b" data-a="genO">Generar pagos del mes</button><button class="g" data-a="addO">+ Pago manual</button><button class="g" data-a="expO">Exportar CSV</button></div>
 <div class="tw"><table><tr><th>Tipo</th><th>Beneficiario</th><th>Concepto</th><th>Monto</th><th>Vence</th><th>Pagado</th><th></th></tr>${O.map(o=>`<tr><td><select data-o="${o.id}" data-f="k">${opt([["mgr","Equipo"],["partner","Partner"]],o.k)}</select></td><td><select data-o="${o.id}" data-f="w">${oOpts(o)}</select></td><td><input value="${esc(o.c)}" data-o="${o.id}" data-f="c"></td><td><input type="number" value="${o.a}" data-o="${o.id}" data-f="a"></td><td><input type="date" value="${o.f}" data-o="${o.id}" data-f="f" class="${!o.ok&&o.f<today()?"od":""}"></td><td><input type="checkbox" style="width:auto" ${o.ok?"checked":""} data-o="${o.id}" data-f="ok"> <span class="mu">${o.ok?fd(o.fp):""}</span></td><td><button class="g d" data-a="delO" data-v="${o.id}">✕</button></td></tr>`).join("")||'<tr><td colspan="7" class="mu">Sin pagos. Genera los del mes.</td></tr>'}</table></div>
 <p class="mu">“Generar pagos del mes” crea, para cada comisionado, la suma de los costos reales de sus clientes activos, y para cada partner su comisión del mes (solo servicios mensuales y semanales; los de pago único agrégalos con “Pago manual”). Marca la casilla al confirmar que ya pagaste: se guarda la fecha.</p>`;
}
function outCard(){
 const t7=addD(today(),7),L=(S.pagosOut||[]).filter(o=>!o.ok&&o.f<=t7).sort((a,b)=>a.f.localeCompare(b.f));
 return `<div class="card"><h3 style="margin-top:0">Pagos por hacer a equipo y partners (${L.length})</h3>${L.map(o=>`<div class="row"><span style="flex:1">${esc(oWho(o))} · ${esc(o.c)} · ${money(o.a)}</span><span class="${o.f<today()?"od":""}">${fd(o.f)}</span><input type="checkbox" style="width:auto" title="Marcar como pagado" data-o="${o.id}" data-f="ok"></div>`).join("")||'<p class="mu">Sin pagos pendientes.</p>'}</div>`}
function vCli(){
 const q=(ui.s||"").toLowerCase(),L=S.clients.filter(c=>(ui.all||c.active)&&(!ui.e||c.enc===ui.e)&&(!q||(c.nombre+c.negocio+c.contacto).toLowerCase().includes(q)));const ENC=[...new Set(S.clients.map(c=>c.enc).filter(Boolean))];
 let I=0,G=0;S.clients.filter(c=>c.active).forEach(c=>{const m=monthly(c);I+=m.i;G+=m.g});
 const open=S.tasks.filter(t=>t.s==="pendiente"||t.s==="trabajando").length;
 return `<div class="stats"><div><b>${S.clients.filter(c=>c.active).length}</b><span class="mu">Clientes activos</span></div><div><b>${money(I)}</b><span class="mu">Ingreso mensual estimado</span></div><div><b>${money(G)}</b><span class="mu">Ganancia mensual estimada</span></div><div><b>${open}</b><span class="mu">Tareas abiertas</span></div></div>
 <div class="row" style="margin-bottom:10px"><input data-c="s" value="${esc(ui.s)}" placeholder="Buscar cliente…" style="width:190px"><select data-c="e" style="width:auto"><option value="">Todos los comisionados</option>${opt(ENC.map(e=>[e,e]),ui.e||"")}</select><label style="margin:0"><input type="checkbox" style="width:auto" data-c="all"${ui.all?" checked":""}> Incluir bajas</label><button class="g" data-a="expC">Exportar CSV</button></div>
 <div class="grid">${L.map(c=>{const end=addM(c.ini,+c.meses||0),dl=days(end),m=monthly(c);
 return `<div class="card"><b>${esc(c.nombre)}</b> ${c.active?"":'<span class="mu">(baja)</span>'}<div class="mu">${esc(c.negocio)}</div>
 <div class="mu">${esc(c.contacto)}</div><div class="mu">Comisionado: ${esc(c.enc||"—")}</div>${c.ref&&par(c.ref)?`<div class="mu">Referido por: <b>${esc(par(c.ref).nombre)}</b></div>`:""}
 <div>${(c.svcs||[]).map(x=>`<span class="tag">${esc(svc(x.sid)?.n||"Servicio")} · ${money(x.p)} ${x.f}</span>`).join("")}</div>
 <div class="mu" style="margin-top:6px">Contrato: ${fd(c.ini)} → ${fd(end)} (${c.meses} meses) · <span class="${dl<0?"od":dl<30?"wn":""}">${dl<0?"vencido":"faltan "+dl+" días"}</span></div>
 <div class="mu">Mensual: ${money(m.i)} · Ganancia: ${money(m.g)}</div>
 ${c.notas?`<div class="mu" style="margin-top:6px">📝 ${esc(c.notas)}</div>`:""}${TL(c)}
 <div class="row" style="margin-top:8px"><button class="g" data-a="edit" data-v="${c.id}">Editar</button><button class="g" data-a="crep" data-v="${c.id}">Informe</button><button class="g d" data-a="toggle" data-v="${c.id}">${c.active?"Dar de baja":"Reactivar"}</button></div></div>`}).join("")||'<p class="mu">Aún no hay clientes. Agrega el primero en “Cliente nuevo”.</p>'}</div>`;
}

function vPar(){
 const P=S.partners||[],T=totals();
 return `<div class="stats"><div><b>${P.filter(p=>p.active!==false).length}</b><span class="mu">Partners activos</span></div><div><b>${money(T.C)}</b><span class="mu">Comisiones mensuales</span></div><div><b>${money(T.N)}</b><span class="mu">Mi ganancia neta</span></div></div>
 <div class="grid">${P.map(p=>{const t=pstat(p);return `<div class="card"><b>${esc(p.nombre)}</b> ${p.active===false?'<span class="mu">(baja)</span>':""}<div class="mu">${esc(p.negocio)}</div><div class="mu">${esc(p.contacto)}</div>
 <div class="mu">Desde ${fd(p.ini)} · Comisión: <b>${+p.pct||0}%</b> de la ganancia de sus referidos</div>
 <div style="margin-top:6px">${t.L.map(c=>`<span class="tag">${esc(c.nombre)} · ${money(monthly(c).g)}</span>`).join("")||'<span class="mu">Aún sin clientes referidos activos.</span>'}</div>
 <div class="mu" style="margin-top:6px">Ganancia generada: ${money(t.G)} · Comisión mensual: <b>${money(t.C)}</b></div>
 ${p.notas?`<div class="mu" style="margin-top:6px">📝 ${esc(p.notas)}</div>`:""}
 <div class="row" style="margin-top:8px"><button class="g" data-a="editP" data-v="${p.id}">Editar</button><button class="g d" data-a="togP" data-v="${p.id}">${p.active===false?"Reactivar":"Dar de baja"}</button></div></div>`}).join("")||'<p class="mu">Aún no hay partners. Agrega el primero en “Partner nuevo”.</p>'}</div>
 <p class="mu">La comisión se calcula sobre la ganancia mensual estimada (cobro menos costo real) de los clientes activos que referió. Para ligar un cliente a un partner, usa el campo “Referido por” al crear o editar el cliente.</p>`;
}
function vParN(){
 const p=ui.editP?par(ui.editP):{nombre:"",contacto:"",negocio:"",pct:35,ini:today(),notas:""};
 return `<div class="card"><h3 style="margin-top:0">${ui.editP?"Editar partner":"Partner nuevo"}</h3>
 <div class="f2"><div><label>Nombre</label><input id="fp_nombre" value="${esc(p.nombre)}"></div>
 <div><label>Contacto (teléfono / correo)</label><input id="fp_contacto" value="${esc(p.contacto)}"></div>
 <div><label>Negocio</label><input id="fp_negocio" value="${esc(p.negocio)}"></div>
 <div><label>Comisión sobre la ganancia (%) — normalmente 35 a 50</label><input type="number" min="0" max="100" id="fp_pct" value="${+p.pct||0}"></div>
 <div><label>Inicio de la alianza</label><input type="date" id="fp_ini" value="${p.ini}"></div></div>
 <label style="margin-top:10px">Notas del acuerdo (forma de pago de comisión, condiciones)</label><textarea id="fp_notas">${esc(p.notas)}</textarea>
 <div class="row" style="margin-top:10px"><button class="b" data-a="saveP">Guardar partner</button>${ui.editP?'<button class="g" data-a="cancelP">Cancelar</button>':""}</div></div>`;
}
function vNew(){
 const c=ui.edit?cl(ui.edit):{nombre:"",contacto:"",negocio:"",enc:"",ini:today(),meses:6,notas:"",svcs:[]};
 return `<div class="card"><h3 style="margin-top:0">${ui.edit?"Editar cliente":"Cliente nuevo"}</h3>
 <div class="f2"><div><label>Nombre</label><input id="f_nombre" value="${esc(c.nombre)}"></div>
 <div><label>Contacto (teléfono / correo)</label><input id="f_contacto" value="${esc(c.contacto)}"></div>
 <div><label>Negocio</label><input id="f_negocio" value="${esc(c.negocio)}"></div>
 <div><label>Comisionado del proyecto</label><input id="f_enc" list="dl_enc" value="${esc(c.enc)}"><datalist id="dl_enc">${(S.mgrs||[]).map(m=>`<option value="${esc(m.n)}">`).join("")}</datalist></div>

 let x=`# ESTADO GENERAL DE CLIENTES ACTIVOS\nFecha del reporte: ${t0}\nClientes activos: ${act.length} | Ingreso mensual estimado: ${money(I)} | Ganancia mensual estimada: ${money(G)}\n\n## INSTRUCCIONES PARA LA IA\nActúa como mi asistente de seguimiento de cuentas. Con estos datos dame: (1) resumen de lo ocurrido en las últimas 24 horas y en la última semana, (2) lo urgente hoy (vencido o con deadline en 3 días), (3) riesgos (cobros vencidos, contratos por vencer, tareas estancadas), (4) el siguiente paso recomendado por cliente, (5) mensajes breves sugeridos para los clientes que lo requieran. Sé concreto y breve.\n\n`;
 act.forEach(c=>{const e=addM(c.ini,+c.meses||0),m=monthly(c),T=S.tasks.filter(t=>t.cid===c.id),P=S.pagos.filter(p=>p.cid===c.id),Lg=S.log.filter(l=>l.cid===c.id&&l.f>=w),Pd=S.pend.filter(p=>p.cid===c.id);
 x+=`## CLIENTE: ${c.nombre} (${c.negocio||"sin negocio"})\n- Contacto: ${c.contacto||"—"} | Comisionado: ${c.enc||"—"} | Referido por: ${par(c.ref)?.nombre||"directo"}\n- Contrato: ${c.ini} → ${e} (${c.meses} meses, ${days(e)<0?"VENCIDO":"faltan "+days(e)+" días"})\n- Servicios: ${(c.svcs||[]).map(s=>(svc(s.sid)?.n||"?")+" "+money(s.p)+" "+s.f).join("; ")||"—"}\n- Ingreso mensual est.: ${money(m.i)} | Ganancia est.: ${money(m.g)}\n${c.notas?"- Notas comerciales: "+c.notas+"\n":""}`;
 ST.forEach(s=>{const L=T.filter(t=>t.s===s);if(L.length)x+=`- Tareas ${STL[s]} (${L.length}):\n`+L.map(t=>`  · ${t.n} | deadline ${fd(t.d)} ${s==="pendiente"||s==="trabajando"?(t.d?sh(t.d):""):""} | avance: ${t.av||"—"}`).join("\n")+"\n"});
 if(!T.length)x+="- Tareas: ninguna registrada\n";
 const pp=P.filter(p=>!p.ok);x+=`- Cobros pendientes: ${pp.length?pp.map(p=>p.c+" "+money(p.a)+" vence "+fd(p.f)+(p.f<t0?" ⚠ VENCIDO":"")).join("; "):"ninguno"}\n`;
 x+=`- Actividad últimos 7 días: ${Lg.length?"\n"+Lg.map(l=>"  · "+fd(l.f)+": "+l.x).join("\n"):"sin movimientos"}\n`;
 if(Pd.length)x+=`- Cambios aún sin informar al cliente: ${Pd.length}\n`;x+="\n"});
 if(!act.length)x+="No hay clientes activos.\n";return x}

const nm=s=>(s||"").trim().toLowerCase();

}
function buildMgr(){

 let x=`# MIS ACTIVIDADES DEL DÍA\nFecha: ${t0}\nComisionado de proyectos: ${S.mgrName||""}\nClientes asignados: ${S.clients.length}\n\n## INSTRUCCIONES PARA LA IA\nActúa como mi asistente. Con estos datos dime: (1) qué debo hacer hoy en orden de prioridad, (2) qué está vencido o en riesgo, (3) qué sigue para cada cliente, (4) a quién conviene avisar o pedirle información. Sé concreto y breve.\n\n`;
 S.clients.forEach(c=>{x+=`## CLIENTE: ${c.nombre} (${c.negocio||"—"})\n- Contacto: ${c.contacto||"—"}\n- Servicios: ${(c.svcs||[]).map(s=>s.n).join("; ")||"—"}\n`;
  ST.forEach(s=>{const L=S.tasks.filter(t=>t.cid===c.id&&t.s===s);if(L.length)x+=`- ${STL[s]} (${L.length}):\n`+L.map(t=>`  · ${t.n} | deadline ${fd(t.d)} ${(s==="pendiente"||s==="trabajando")&&t.d?sh(t.d):""} | avance: ${t.av||"—"}`).join("\n")+"\n"});x+="\n"});
 if(!S.clients.length)x+="Sin clientes asignados.\n";return x}
function vUsr(){return `<p class="mu">Usuarios del sistema (se definen al instalar). Para que un cliente aparezca en la vista de un comisionado, escribe su nombre exactamente igual en “Comisionado del proyecto”.</p>`+S.mgrs.map((m,i)=>`<div class="card"><b>Comisionado ${i+1}: ${esc(m.n)}</b><div class="mu">Clientes asignados: ${S.clients.filter(c=>c.active&&nm(c.enc)===nm(m.n)).length}</div></div>`).join("")+`<p class="mu">Para cambiar contraseñas o nombres: borra data/users.json en el servidor y abre setup.php de nuevo (tus clientes no se borran).</p>`}
